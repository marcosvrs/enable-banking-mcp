name: Privacy and secrets

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  privacy:
    name: Scan privacy and secrets
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        # v7
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        # v7
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false

      - name: Scan PII and account-specific denylist
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          PRIVACY_FORBIDDEN_VALUES: ${{ secrets.PRIVACY_FORBIDDEN_VALUES }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            node scripts/privacy-scan.mjs --range "${BASE_SHA}..${HEAD_SHA}"
          elif [[ "$EVENT_NAME" == "push" && ! "$BEFORE_SHA" =~ ^0+$ ]]; then
            node scripts/privacy-scan.mjs --range "${BEFORE_SHA}..${HEAD_SHA}"
          else
            node scripts/privacy-scan.mjs --history
          fi

      - name: Scan secrets with Gitleaks
        # v3
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "false"
