name: Privacy and secrets

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  privacy:
    name: Scan privacy and secrets
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        # v7
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        # v7
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false

      - name: Scan PII and account-specific denylist
        env:
          PRIVACY_FORBIDDEN_VALUES: ${{ secrets.PRIVACY_FORBIDDEN_VALUES }}
        run: node scripts/privacy-scan.mjs --history

      - name: Scan secrets with Gitleaks
        # v3
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "false"
